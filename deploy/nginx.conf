# SyncFrame Web 反向代理：静态资源本地出，/api 与 /ws 走服务端容器
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html lobby.html;

    # 同步 WebSocket（P2/P3 房间通道）
    location /ws {
        proxy_pass http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 房间鉴权 / 选片 / 媒体授权 REST
    location /api/ {
        proxy_pass http://server:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /lobby.html;
    }

    # 说明：/ 由 index.html 即时重定向到 /lobby.html（与 Vite 开发服务器行为一致），
    # 避免部署后直接访问根路径出现 404 或目录列表造成误解。
}
