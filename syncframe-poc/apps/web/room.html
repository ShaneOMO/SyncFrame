<!doctype html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%230A0A0B' stroke='%230A84FF'/%3E%3Cpath d='M10 8.2v7.6L16 12z' fill='%230A84FF'/%3E%3C/svg%3E" />
  <title>SyncFrame · 观影房间</title>
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("syncframe-theme"); } catch (e) {}
      if (theme === "light") document.documentElement.classList.remove("dark");
    })();
  </script>
  <style>
    /* movi-player 内置控件主题：对齐 SyncFrame 设计体系（glass + 单一强调色） */
    movi-player {
      --movi-accent: #0A84FF;
      --movi-progress-color: #0A84FF;
      --movi-glass-bg: rgba(20, 20, 22, 0.62);
      --movi-glass-blur: 28px;
      --movi-glass-border: rgba(255, 255, 255, 0.12);
      --movi-chrome-bg: rgba(14, 14, 16, 0.94);
      --movi-chrome-border: rgba(255, 255, 255, 0.1);
      --movi-btn-hover-bg: rgba(255, 255, 255, 0.12);
      --movi-divider-color: rgba(255, 255, 255, 0.12);
      --movi-text-secondary: rgba(245, 245, 247, 0.72);
      --movi-text-tertiary: rgba(245, 245, 247, 0.5);
      --movi-progress-buffer-color: rgba(255, 255, 255, 0.22);
      --movi-radius-surface: 12px;
      width: 100%;
      height: 100%;
      display: block;
    }
    movi-player:focus { outline: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/pages/room-main.tsx"></script>
</body>
</html>
