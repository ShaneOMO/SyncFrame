<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%230A0A0B' stroke='%230A84FF'/%3E%3Cpath d='M10 8.2v7.6L16 12z' fill='%230A84FF'/%3E%3C/svg%3E" />
  <title>SyncFrame · 观影房间</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <style>
    /* 本页专属：布局与观影室特有元素；颜色一律引用 tokens，class 名冻结 */
    body { padding: 0 20px var(--sp-8); font-size: var(--fs-body); line-height: 1.55; }

    /* ── 顶栏：毛玻璃吸顶，与内容区同宽对齐 ── */
    header.top {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      max-width: none; margin: 0 -20px var(--sp-5);
      padding: 12px max(24px, calc((100% - var(--container)) / 2 + 20px));
      border-bottom: 0.5px solid var(--border);
      background: rgba(10, 10, 11, 0.72);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
    }
    header.top > * { position: relative; }
    header.top .logo { font-size: var(--fs-body); font-weight: 600; letter-spacing: 0.3px; display: inline-flex; align-items: center; gap: 10px; }
    header.top .logo .logo-mark { color: var(--accent); display: inline-flex; }
    header.top .logo span { color: var(--text-dim); font-weight: 400; font-size: var(--fs-caption); margin-left: 2px; }
    header.top #members { display: inline-flex; gap: var(--sp-1); flex-wrap: wrap; }
    header.top > a { display: inline-flex; }

    /* ── 布局 ── */
    .layout {
      display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--sp-4);
      max-width: var(--container); margin: 0 auto;
    }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

    .card h3 {
      color: var(--text); letter-spacing: 0.2px;
      display: flex; align-items: center; gap: var(--sp-2);
      font-size: var(--fs-body);
    }
    .card h3 span { font-weight: 400; color: var(--text-dim); font-size: var(--fs-caption); }
    .card h3 .right { margin-left: auto; display: flex; gap: 6px; }

    /* ── 播放器 ── */
    #playerWrap {
      position: relative; border-radius: var(--radius); overflow: hidden;
      background: #000; aspect-ratio: 16/9;
    }
    #playerWrap movi-player { width: 100%; height: 100%; display: block; }

    /* movi-player 内置控件主题：对齐 SyncFrame 设计体系（glass + 单一强调色） */
    #playerWrap movi-player {
      --movi-accent: #0A84FF;
      --movi-progress-color: #0A84FF;
      --movi-glass-bg: rgba(20, 20, 22, 0.62);
      --movi-glass-blur: 28px;
      --movi-glass-border: rgba(255, 255, 255, 0.12);
      --movi-chrome-bg: rgba(14, 14, 16, 0.94);
      --movi-chrome-border: rgba(255, 255, 255, 0.1);
      --movi-btn-hover-bg: rgba(255, 255, 255, 0.12);
      --movi-divider-color: rgba(255, 255, 255, 0.12);
      --movi-text-secondary: rgba(245, 245, 247, 0.72);
      --movi-text-tertiary: rgba(245, 245, 247, 0.5);
      --movi-progress-buffer-color: rgba(255, 255, 255, 0.22);
      --movi-radius-surface: 12px;
    }
    /* 隐藏原生聚焦描边，由 SyncFrame 全局 focus-visible 规则接管 */
    #playerWrap movi-player:focus { outline: none; }
    #gestureOverlay {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(10, 10, 11, 0.8);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      z-index: 5;
    }
    #gestureOverlay.show { display: flex; }
    #gestureOverlay button { font-size: var(--fs-body); font-weight: 600; padding: 12px 28px; }
    #clockFace {
      font: 700 54px/1.2 var(--font-mono);
      text-align: center; padding: 40px 0 var(--sp-2); letter-spacing: 2px;
    }
    #clockSub { text-align: center; color: var(--text-dim); padding-bottom: 34px; }

    /* ── 控制条已由 movi-player 内置控件接管，此处仅保留播放器容器样式 ── */
    .viewer-bar { padding: 12px 4px 2px; color: var(--text-dim); font-size: var(--fs-small); display: flex; align-items: center; gap: var(--sp-2); }
    .viewer-bar .live-dot {
      width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--success);
      display: inline-block; flex: 0 0 auto;
    }
    .viewer-bar.paused .live-dot { background: var(--warning); }
    #viewerBarTime { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-caption); }
    #status { color: var(--text-dim); font-size: var(--fs-small); min-height: 20px; padding: 8px 4px 0; }
    #status.warn { color: var(--warning); }
    #status.warn::before {
      content: ""; display: inline-block; width: 6px; height: 6px;
      border-radius: var(--radius-pill); background: var(--warning);
      margin-right: var(--sp-2); vertical-align: 1px;
    }

    /* ── 媒体库面板 ── */
    #browseList {
      max-height: 300px; overflow-y: auto; margin-top: var(--sp-2);
      border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg);
    }
    .browse-row {
      display: flex; align-items: center; gap: var(--sp-2);
      padding: 7px var(--sp-3); border-bottom: 0.5px solid var(--border); cursor: default;
      transition: background var(--dur) var(--ease);
    }
    .browse-row:last-child { border-bottom: 0; }
    .browse-row.video, .browse-row.dir { cursor: pointer; }
    .browse-row.video:hover, .browse-row.dir:hover { background: var(--panel-2); }
    .browse-icon { flex: 0 0 auto; color: var(--text-dim); display: inline-flex; }
    .browse-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .browse-size { color: var(--text-faint); font-size: var(--fs-caption); flex: 0 0 auto; }
    .browse-pick { padding: 3px 12px; font-size: var(--fs-caption); flex: 0 0 auto; }
    .browse-empty { padding: 22px; text-align: center; color: var(--text-faint); font-size: var(--fs-small); }
    #browsePath { flex: 1; min-width: 160px; }

    /* ── 播放列表 ── */
    #mediaList .browse-row { cursor: default; }
    .media-kind { font-size: 11px; color: var(--text-dim); border: 0.5px solid var(--border); border-radius: var(--radius-pill); padding: 1px var(--sp-2); flex: 0 0 auto; }
    .media-provider { font-size: 11px; color: var(--accent); border: 0.5px solid rgba(10, 132, 255, 0.35); border-radius: var(--radius-pill); padding: 1px var(--sp-2); flex: 0 0 auto; }
    #mediaList .browse-row.video-row { cursor: pointer; }
    #mediaList .browse-row.video-row:hover { background: var(--panel-2); }
    #mediaList .browse-row.current { background: var(--accent-soft); }

    /* ── 在线人数 ── */
    .member-stats { display: flex; gap: 6px; flex-wrap: wrap; }
    .stat-box {
      flex: 1; min-width: 72px; text-align: center;
      border: 0.5px solid var(--border); border-radius: var(--radius);
      padding: 10px 4px; color: var(--text-dim); font-size: var(--fs-caption);
      transition: border-color var(--dur) var(--ease);
    }
    .stat-box:hover { border-color: var(--border-strong); }
    .stat-box b { display: block; font-size: 18px; font-weight: 600; color: var(--text); font-family: var(--font-mono); margin-top: 2px; }

    /* ── 添加影片弹窗 ── */
    .modal {
      position: fixed; inset: 0; z-index: 50; display: flex;
      align-items: flex-start; justify-content: center; padding: 8vh 16px 16px;
      background: rgba(0, 0, 0, 0.6);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .modal[hidden] { display: none; }
    .modal-card {
      width: 100%; max-width: 460px; background: var(--panel);
      border: 0.5px solid var(--border-strong); border-radius: var(--radius-lg);
      padding: var(--sp-5); box-shadow: var(--shadow-pop);
      max-height: 84vh; overflow-y: auto;
    }
    .modal-head { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
    .modal-head h2 { font-size: var(--fs-title); flex: 1; }
    .modal-head button.icon { width: 30px; height: 30px; padding: 0; margin-top: 0; }
    .tabs {
      display: flex; gap: var(--sp-1); padding: 3px;
      background: var(--panel-2); border-radius: var(--radius-pill);
      margin-bottom: var(--sp-4);
    }
    .tab { flex: 1; margin-top: 0; padding: 6px 0; font-weight: 500; font-size: var(--fs-small); border: 0; background: transparent; }
    .tab.active { background: var(--panel-hover); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .add-pane select, .add-pane input { width: 100%; }
    .add-pane .pane-add { width: 100%; margin-top: var(--sp-3); }
    #addMediaMsg { min-height: 18px; font-size: var(--fs-caption); color: var(--warning); margin: var(--sp-2) 0 0; }
    #addMediaMsg.ok { color: var(--success); }
    .add-hint { color: var(--text-faint); font-size: var(--fs-caption); margin: var(--sp-2) 0 0; line-height: 1.6; }
    .add-hint button { display: inline; width: auto; margin: 0; padding: 0; font-size: inherit; background: none; border: 0; color: var(--accent); text-decoration: underline; }
    /* 弹窗内嵌媒体库 */
    #browseList { margin-top: var(--sp-2); }
    #openlistPane .row { flex-wrap: wrap; }
    /* 顶栏自己的成员 chip：可点击打开账户设置 */
    #members .chip.me { cursor: pointer; border: 0.5px solid var(--border-strong); }
    #members .chip.me:hover { background: var(--panel-hover); }

    /* ── 邀请行：卡片化横条，与内容区同宽 ── */
    #inviteRow {
      display: none; align-items: center; gap: 10px; flex-wrap: wrap;
      max-width: var(--container); margin: 0 auto var(--sp-4);
      background: var(--panel); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 10px var(--sp-4);
    }
    #inviteRow.show { display: flex; }
    #inviteRow > label { color: var(--text-dim); font-size: var(--fs-caption); flex: 0 0 auto; }
    #inviteLink { flex: 1; min-width: 220px; font-size: var(--fs-caption); }
    #inviteRow button { padding: 5px 14px; }
    @media (max-width: 560px) {
      #inviteRow button { padding: 9px 16px; }
      body { padding: 0 12px var(--sp-6); }
      /* 顶栏收紧：隐藏副标题、减小内边距与间距，避免小屏下占满首屏 */
      header.top { margin: 0 -12px var(--sp-4); padding: 10px 14px; gap: 6px; }
      header.top .logo span { display: none; }
      #inviteRow { padding: 10px 12px; }
      /* 浏览工具栏允许更窄的路径输入，搜索框保持整行换行 */
      #browsePath { min-width: 0; }
      #browseSearch { min-width: 0 !important; flex: 1 1 140px; }
      .stat-box { min-width: 60px; padding: 8px 2px; }
      .stat-box b { font-size: 16px; }
      #clockFace { font-size: 40px; padding: 24px 0 var(--sp-2); }
    }
  </style>
</head>
<body>
  <!-- 图标 sprite：与 src/icons.ts 的路径定义保持一致（lucide 风格 24×24 描边） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7z" fill="currentColor" stroke="none"/><path d="M13.5 5H17v14h-3.5z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 0 0 6-6L14 13l-3-3z"/></symbol>
    </defs>
  </svg>

  <header class="top">
    <span class="logo">
      <svg class="logo-mark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5"/><path d="M10 8.2v7.6L16 12z" fill="currentColor" stroke="none"/>
      </svg>
      SyncFrame<span>多人同步观影室</span>
    </span>
    <span id="roomBadge" class="badge">房间 <b>-</b></span>
    <span id="roleBadge" class="badge viewer">观众</span>
    <span id="connBadge" class="badge conn">连接中…</span>
    <span id="mediaBadge" class="badge">无媒体</span>
    <span class="spacer"></span>
    <span id="members"></span>
    <button id="inviteToggle" class="ghost" title="邀请码与分享"><svg class="ic"><use href="#i-users"/></svg>邀请</button>
    <a href="/lobby.html"><button class="ghost" title="返回大厅">退出房间</button></a>
  </header>

  <div id="inviteRow">
    <label for="inviteLink">邀请链接</label>
    <input id="inviteLink" readonly title="任何人打开此链接即可进房；重置后旧链接立即失效" />
    <button id="copyInvite" class="primary">复制链接</button>
    <button id="rotateInvite" class="danger" title="旧链接立即失效，已加入成员不受影响">重置链接</button>
  </div>

  <div class="layout">
    <div>
      <!-- 播放器 -->
      <div class="card" style="padding:10px">
        <div id="clockMode" hidden>
          <div id="clockFace">00:00:00.0</div>
          <div id="clockSub">虚拟时钟模式</div>
        </div>
        <div id="playerWrap" hidden>
          <movi-player theme="dark" wasmurl=""></movi-player>
          <div id="gestureOverlay"><button id="joinPlay" class="primary"><svg class="ic ic-fill" style="width:17px;height:17px"><use href="#i-play"/></svg>点击加入播放</button></div>
        </div>
        <!-- 观众状态条 -->
        <div class="viewer-bar" id="viewerBar" hidden>
          <span class="live-dot"></span>
          <span id="viewerBarText">跟随房主</span>
          <span id="viewerBarTime"></span>
        </div>
        <div id="status" role="status" aria-live="polite">初始化…</div>
      </div>
    </div>

    <div>
      <!-- 在线人数（房主 + 游客） -->
      <div class="card" id="statsCard">
        <h3>在线人数 <span>房主 + 游客</span></h3>
        <div id="memberStats" class="member-stats">
          <span class="stat-box">同步用户 <b id="statTotal">0</b></span>
          <span class="stat-box">房主 <b id="statHost">0</b></span>
          <span class="stat-box">游客 <b id="statGuest">0</b></span>
        </div>
      </div>

      <!-- 播放列表 -->
      <div class="card">
        <h3>
          播放列表 <span>点击播放（房主）</span>
          <span class="right"><button id="addMediaBtn" class="primary" hidden>＋ 添加影片</button></span>
        </h3>
        <div id="mediaList"></div>
      </div>
    </div>
  </div>

  <!-- 添加影片弹窗（仅房主可见按钮）：直链 / B 站链接 / OpenList 媒体库 / OpenList 路径 -->
  <div id="addMediaModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="添加影片">
      <div class="modal-head">
        <h2>添加影片</h2>
        <button id="addMediaClose" class="icon ghost" aria-label="关闭">✕</button>
      </div>
      <div class="tabs" id="addMediaTabs">
        <button class="tab active" data-tab="direct">直链</button>
        <button class="tab" data-tab="bili">B 站链接</button>
        <button class="tab" data-tab="openlist" id="tabOpenlist" hidden>OpenList 媒体库</button>
        <button class="tab" data-tab="path" id="tabPath" hidden>OpenList 路径</button>
      </div>

      <div class="add-pane" data-pane="direct">
        <input type="text" id="addName" placeholder="视频名称（可选）" maxlength="128" />
        <input type="text" id="addUrl" placeholder="直链视频地址（http/https）" style="margin-top:6px" />
        <button id="addDirectBtn" class="primary pane-add">添加到播放列表</button>
      </div>

      <div class="add-pane" data-pane="bili" hidden>
        <select id="biliProviderSel" aria-label="B 站来源"></select>
        <input type="text" id="addBiliUrl" placeholder="B 站视频：BV 号 / av 号 / bilibili 链接" style="margin-top:6px" />
        <button id="addBiliBtn" class="primary pane-add">添加到播放列表</button>
      </div>

      <div class="add-pane" data-pane="path" id="pathPane" hidden>
        <select id="addProvider" aria-label="选择 OpenList provider"></select>
        <input type="text" id="addPath" placeholder="OpenList 文件路径，如 /movies/a.mkv" style="margin-top:6px" />
        <button id="addPathBtn" class="primary pane-add">添加到播放列表</button>
      </div>

      <div class="add-pane" data-pane="openlist" id="openlistPane" hidden>
        <div class="row">
          <select id="browseProvider" style="flex:1 1 180px" aria-label="选择 OpenList provider"></select>
        </div>
        <div class="row" style="margin-top:var(--sp-2)">
          <button id="browseUp" title="上级目录" aria-label="上级目录" class="icon" style="width:32px;height:32px"><svg class="ic"><use href="#i-arrow-up"/></svg></button>
          <input type="text" id="browsePath" value="/" aria-label="目录路径" />
          <button id="browseGo">进入</button>
          <input type="text" id="browseSearch" placeholder="搜索文件名…" aria-label="搜索文件名" style="min-width:130px;flex:0 1 200px" />
          <button id="browseSearchBtn">搜索</button>
          <span class="spacer"></span>
          <button id="browsePrev">上一页</button>
          <span id="browsePageInfo" style="color:var(--text-dim);font-size:12px"></span>
          <button id="browseNext">下一页</button>
        </div>
        <div id="browseList"></div>
      </div>

      <p id="addMediaMsg" role="status" aria-live="polite"></p>
      <p class="add-hint">需要添加 OpenList / B 站凭据？<button id="addMediaSettings" type="button">点击打开账户设置</button>（也可点顶栏自己的昵称）</p>
    </div>
  </div>

  <script type="module" src="/src/room-main.ts"></script>
</body>
</html>
