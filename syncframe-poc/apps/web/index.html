<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%230e1013' stroke='%234c8dff'/%3E%3Cpath d='M10 8.2v7.6L16 12z' fill='%234c8dff'/%3E%3C/svg%3E" />
  <title>SyncFrame P1 · 播放器验证页</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <style>
    /* 本页专属：顶栏 + 验证面板布局，颜色一律引用 tokens */
    body { padding: 0; }

    .topnav {
      display: flex; align-items: center; gap: var(--sp-2);
      padding: var(--sp-4) 20px;
      border-bottom: 1px solid var(--border);
    }
    .topnav .brand {
      display: inline-flex; align-items: center; gap: var(--sp-2);
      font-size: var(--fs-title); font-weight: 700; letter-spacing: 0.3px;
      color: var(--text); text-decoration: none;
    }
    .topnav .brand .logo-mark { color: var(--accent); display: inline-flex; }
    .topnav nav { margin-left: auto; display: flex; align-items: center; gap: var(--sp-4); }
    .topnav nav a { color: var(--text-dim); font-size: var(--fs-small); }
    .topnav nav a:hover { color: var(--text); text-decoration: none; }

    main { max-width: var(--container); margin: 0 auto; padding: var(--sp-6) 20px var(--sp-8); }
    .page-head { margin-bottom: var(--sp-5); }
    .page-head .sub { color: var(--text-dim); margin: var(--sp-1) 0 0; font-size: var(--fs-small); }

    .panel { padding: var(--sp-3); }
    input[type="text"] { flex: 1; min-width: 200px; }
    #path { min-width: 320px; }
    button.primary { padding: 6px 14px; }
    movi-player { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius); display: block; }
    #stats { font-family: var(--font-mono); font-size: var(--fs-caption); white-space: pre-wrap; color: var(--success); }
    label.small { font-size: var(--fs-caption); color: var(--text-dim); display: flex; align-items: center; gap: var(--sp-1); }
    #status { color: var(--warning); font-size: var(--fs-small); min-height: 20px; }
  </style>
</head>
<body>
  <header class="topnav">
    <a class="brand" href="/" aria-label="SyncFrame 播放器验证页">
      <svg class="logo-mark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5"/><path d="M10 8.2v7.6L16 12z" fill="currentColor" stroke="none"/>
      </svg>
      SyncFrame
    </a>
    <nav>
      <a href="/lobby.html" title="多人同步观影室（P3）">观影室大厅</a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <h1>P1 · 原始文件播放验证页</h1>
      <p class="sub">无房间逻辑：验证 OpenList 直链 / 代理两种路线的原始文件播放与指标采集。</p>
    </div>

    <div class="panel">
      <div class="row">
        <input id="path" type="text" placeholder="OpenList 文件路径，如 /movies/example.mkv" aria-label="OpenList 文件路径" />
        <select id="route" aria-label="播放路线">
          <option value="raw">直链（raw_url，优先路线）</option>
          <option value="proxy">OpenList 代理（/d，兜底路线）</option>
        </select>
        <button id="load" class="primary">载入</button>
        <button id="reloadCold" class="secondary" title="销毁播放器并重新创建，测冷启动">冷启动重载</button>
        <button id="reloadWarm" class="secondary" title="不重建播放器重新载入同一文件，测热启动">热启动重载</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="secondary" data-seek="0.1">Seek 10%</button>
        <button class="secondary" data-seek="0.5">Seek 50%</button>
        <button class="secondary" data-seek="0.9">Seek 90%</button>
        <button class="secondary" id="rateBtn">倍速: 1×</button>
        <span class="hint">音轨 / 字幕 / 字幕偏移：用播放器自带菜单（齿轮）切换，Nerd Stats 按 <b>I</b></span>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </div>

    <div class="panel">
      <movi-player id="player" controls></movi-player>
    </div>

    <div class="panel">
      <div class="row" style="margin-bottom:8px">
        <label class="small">解码引擎观察（按 I）:
          <select id="decoder">
            <option value="">未填写</option>
            <option value="hardware">硬解（WebCodecs）</option>
            <option value="software">软解（FFmpeg WASM）</option>
            <option value="native">原生 &lt;video&gt;</option>
          </select>
        </label>
        <label class="small">容器/编码补充（ffprobe）:
          <input id="codecInfo" type="text" placeholder="如 MKV/HEVC 10bit/AAC" style="min-width:200px" />
        </label>
        <button id="export" class="primary">导出指标 JSON</button>
        <button id="upload" class="secondary">上传报告到服务端</button>
        <button id="clear" class="secondary">清空指标</button>
      </div>
      <div id="stats">尚未载入。</div>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
