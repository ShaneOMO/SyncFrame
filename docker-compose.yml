# SyncFrame P3 一键测试环境
#
# 用法（仓库根目录 = syncframe-poc 的上级，即包含本文件的目录）：
#   docker compose up --build
# 然后浏览器打开 http://localhost:7300/lobby.html
#
# 服务：
#   - web：nginx 托管 Vite 构建产物，/api 与 /ws 反代到 server
#   - server：Node 验证后端（房间鉴权 + 同步 + OpenList 选片/授权）
#
# OpenList 连接通过环境变量注入（不要写入镜像）：
#   OPENLIST_BASE_URL / OPENLIST_USERNAME / OPENLIST_PASSWORD

services:
  server:
    build:
      context: ./syncframe-poc
      dockerfile: ../deploy/server.Dockerfile
    environment:
      SERVER_PORT: "8787"
      OPENLIST_BASE_URL: ${OPENLIST_BASE_URL:-}
      OPENLIST_USERNAME: ${OPENLIST_USERNAME:-}
      OPENLIST_PASSWORD: ${OPENLIST_PASSWORD:-}
    expose:
      - "8787"
    restart: unless-stopped

  web:
    build:
      context: ./syncframe-poc
      dockerfile: ../deploy/web.Dockerfile
    ports:
      - "7300:80"
    depends_on:
      - server
    restart: unless-stopped
