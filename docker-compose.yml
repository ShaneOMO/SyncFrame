# SyncFrame 一键部署环境
#
# 用法（仓库根目录 = 包含本文件的目录）：
#   docker compose up --build
# 然后浏览器打开 http://localhost:7300/lobby.html
#
# 服务：
#   - web：nginx 托管 Vite 构建产物，/api 与 /ws 反代到 server
#   - server：Node 后端（账户权限 + 房间鉴权 + 同步 + provider 媒体解析）
#
# 管理员账户通过环境变量初始化（注册已关闭，账户全部由管理员管理）：
#   ADMIN_USERNAME / ADMIN_PASSWORD

services:
  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    environment:
      SERVER_PORT: "8787"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    expose:
      - "8787"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "7300:80"
    depends_on:
      - server
    restart: unless-stopped
