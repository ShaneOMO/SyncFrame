# SyncFrame 一键部署（单容器）
#
# 用法（仓库根目录 = 包含本文件的目录）：
#   docker compose up --build -d
# 然后浏览器打开 http://localhost:7300/
#
# 服务：单个 server 容器同时提供
#   - 前端静态资源（Vite 构建产物，由后端托管，/ 自动进入大厅）
#   - /api 房间鉴权 / 媒体授权 REST
#   - /ws  WebSocket 同步房间（长连接）
#
# 管理员账户通过环境变量初始化（注册已关闭，账户全部由管理员管理）：
#   ADMIN_USERNAME / ADMIN_PASSWORD
#
# 反向代理：本编排不再内置 nginx；如需域名/HTTPS，请自行在最外层反代
# 到映射端口（注意 /ws 需要 Upgrade 长连接，示例见 README）。

services:
  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    environment:
      SERVER_PORT: "8787"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "7300:8787"
    restart: unless-stopped
